<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#009fa7" />
    <meta name="description" content="OK KARD 会员专属入口。敬请期待。" />
    <link rel="canonical" href="https://okkard.club/" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>OK KARD 会员专属 · 敬请期待</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <a class="brand" href="./" aria-label="OK KARD 香港启德首页">
          <span class="logo-crop"><img src="./assets/okkard-logo.jpg" alt="OK KARD 香港启德" width="1200" height="896" /></span>
        </a>
        <span class="header-label">
          <svg class="member-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="10" r="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M6 15c.6-2.4 5.4-2.4 6 0M15 10h3M15 14h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          会员专属入口
          <span class="entry-accent" aria-hidden="true"></span>
        </span>
      </header>

      <main class="hero">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow"><span></span> OK KARD MEMBERS CLUB</p>
          <h1 id="page-title">OK KARD<span>会员专属<span class="title-dot">.</span></span></h1>
          <div class="title-rule" aria-hidden="true"></div>
          <p class="description">专属空间，<br class="mobile-break" />为每一位会员而留。</p>
          <p class="status"><span class="status-dot" aria-hidden="true"></span>敬请期待</p>
        </section>

        <div class="art" role="img" aria-label="OK KARD 品牌会员卡展示">
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
          <span class="art-dot"></span>
          <span class="spark spark-one">+</span>
          <span class="spark spark-two">+</span>
          <div class="card card-back">
            <div class="back-top"><span>OK KARD</span><span class="card-symbol">✳</span></div>
            <div class="back-pattern"></div>
            <div class="back-bottom"><span>MEMBERS CLUB</span><span>专属于你</span></div>
          </div>
          <div class="card card-front">
            <div class="card-top"><span>MEMBER EXCLUSIVE</span><span class="card-mark"><i></i><i></i></span></div>
            <span class="card-logo logo-crop"><img src="./assets/okkard-logo.jpg" alt="" width="1200" height="896" /></span>
            <div class="card-bottom"><span>会员专属</span><span>okkard.club <span aria-hidden="true">↗</span></span></div>
          </div>
          <span class="art-caption"><span></span> A SPACE TO CALL YOUR OWN</span>
        </div>
      </main>

    </div>
